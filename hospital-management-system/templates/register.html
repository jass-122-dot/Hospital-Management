{% extends "base.html" %}
{% block title %}Register - HMS{% endblock %}
{% block content %}
<div class="auth-wrap">
    <form class="auth-card" id="registerForm" method="POST" action="{{ url_for('register') }}">
        <h2>Create Account</h2>
        <p class="auth-sub">Register for Hospital Management System</p>

        <label>Full Name</label>
        <input type="text" name="name" class="form-input" required autofocus data-nav>

        <label>Email</label>
        <input type="email" name="email" class="form-input" required data-nav>

        <label>Password</label>
        <input type="password" name="password" class="form-input" required data-nav>

        <label>Register as</label>
        <select name="role" class="form-input" data-nav>
            <option value="Patient">Patient</option>
            <option value="Doctor">Doctor</option>
            <option value="Admin">Admin</option>
        </select>

        <button type="submit" class="btn btn-primary btn-block">Register</button>
        <p class="auth-foot">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
    </form>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/form-nav.js') }}"></script>
<script>initFormKeyboardNav('registerForm');</script>
{% endblock %}
