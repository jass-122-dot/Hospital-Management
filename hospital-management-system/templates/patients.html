{% extends "base.html" %}
{% block title %}Patients - HMS{% endblock %}
{% block content %}
<div class="page-header">
    <h1 class="page-title">Patients</h1>
    <button class="btn btn-primary" id="addBtn">+ Add Patient</button>
</div>

<div class="table-wrap">
    <table class="data-table">
        <thead>
            <tr>
                <th>ID</th><th>Name</th><th>Age</th><th>Gender</th>
                <th>Blood Group</th><th>Phone</th><th>Address</th><th>Actions</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="8" class="empty-row">Loading...</td></tr>
        </tbody>
    </table>
</div>

<!-- Form Modal -->
<div id="formModal" class="modal-overlay hidden">
    <div class="modal-box modal-form">
        <h3 id="formTitle">Add Patient</h3>
        <form id="entityForm">
            <input type="hidden" id="entityId">

            <label>Name</label>
            <input type="text" id="f_name" class="form-input" required data-nav>

            <label>Age</label>
            <input type="number" id="f_age" class="form-input" min="0" max="120" data-nav>

            <label>Gender</label>
            <select id="f_gender" class="form-input" data-nav>
                {% for g in genders %}<option value="{{ g }}">{{ g }}</option>{% endfor %}
            </select>

            <label>Blood Group</label>
            <select id="f_blood_group" class="form-input" data-nav>
                {% for b in blood_groups %}<option value="{{ b }}">{{ b }}</option>{% endfor %}
            </select>

            <label>Phone</label>
            <input type="text" id="f_phone" class="form-input" data-nav>

            <label>Address</label>
            <input type="text" id="f_address" class="form-input" data-nav>

            <div class="modal-actions">
                <button type="submit" class="btn btn-primary">Save</button>
                <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/form-nav.js') }}"></script>
<script src="{{ url_for('static', filename='js/crud.js') }}"></script>
<script>
const fieldMap = {
    f_name: 'name', f_age: 'age', f_gender: 'gender',
    f_blood_group: 'blood_group', f_phone: 'phone', f_address: 'address'
};
initCrudPage({
    apiBase: '/api/patients',
    fieldMap: fieldMap,
    entityLabel: 'Patient',
    renderRow: function(row) {
        return `<tr>
            <td>${row.id}</td>
            <td>${row.name || ''}</td>
            <td>${row.age || ''}</td>
            <td>${row.gender || ''}</td>
            <td>${row.blood_group || ''}</td>
            <td>${row.phone || ''}</td>
            <td>${row.address || ''}</td>
            <td>
                <button class="btn btn-sm btn-edit" data-id="${row.id}">Edit</button>
                <button class="btn btn-sm btn-danger" data-id="${row.id}">Delete</button>
            </td>
        </tr>`;
    },
    emptyColspan: 8
});
</script>
{% endblock %}
